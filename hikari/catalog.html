<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Автомобили — hikari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body data-page="catalog">
<main class="wrap">
  <div class="cat-head">
    <h1>Автомобили <sup id="count"></sup></h1>
  </div>
  <form id="filters" class="bar">
    <select name="make" aria-label="Марка"></select>
    <select name="model" aria-label="Модель"></select>
    <select name="year_from" aria-label="Год от"></select>
    <input type="number" name="price_to" placeholder="Цена до, $" min="0" step="10000" aria-label="Цена до">
    <select name="km_to" aria-label="Пробег"><option value="">Любой пробег</option><option value="5000">до 5 000 км</option><option value="10000">до 10 000 км</option><option value="30000">до 30 000 км</option></select>
    <select name="sort" aria-label="Сортировка"><option value="new">Новые</option><option value="deal">Выгодные</option><option value="cheap">Дешевле</option><option value="expensive">Дороже</option><option value="km">Пробег</option></select>
    <input type="hidden" name="body">
    <input type="hidden" name="year_to">
  </form>
  <div class="chips" id="chips"></div>
  <div class="cards" id="grid"></div>
  <nav class="pager" id="pager"></nav>
</main>
<script src="../data/cars.js?v=3" charset="utf-8"></script>
<script src="../shared/core.js?v=3" charset="utf-8"></script>
<script src="site.js?v=3" charset="utf-8"></script>
</body>
</html>
