<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог — SORA auto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body data-page="catalog">
<main class="wrap">
  <nav class="crumbs"><a href="index.html">Главная</a> › <a href="catalog.html">Каталог</a> › <span id="crumb"></span></nav>
  <div class="cat-grid">
    <aside class="side panel">
      <form id="filters" class="filters">
        <div class="side-head"><b>Фильтры</b><button type="reset">Сбросить</button></div>
        <input type="hidden" name="q">
        <label>Марка<select name="make"></select></label>
        <label>Модель<select name="model"></select></label>
        <label>Кузов<select name="body"></select></label>
        <label>Год выпуска<span class="pair"><select name="year_from"></select><select name="year_to"></select></span></label>
        <label>Цена, $<span class="pair"><input type="number" name="price_from" placeholder="от" min="0" step="10000"><input type="number" name="price_to" placeholder="до" min="0" step="10000"></span></label>
        <label>Пробег<select name="km_to"><option value="">Любой</option><option value="5000">до 5 000 км</option><option value="10000">до 10 000 км</option><option value="30000">до 30 000 км</option><option value="50000">до 50 000 км</option></select></label>
        <label class="sort-in">Сортировка<select name="sort"><option value="new">Сначала новые</option><option value="deal">Сначала выгодные</option><option value="cheap">Цена ↑</option><option value="expensive">Цена ↓</option><option value="km">Пробег ↑</option></select></label>
      </form>
    </aside>
    <div>
      <div class="res-head">
        <h1>Найдено <span id="count"></span> авто</h1>
        <button class="btn btn-ghost" id="toggle-filters">Фильтры</button>
      </div>
      <div class="rows" id="grid"></div>
      <nav class="pager" id="pager"></nav>
    </div>
  </div>
</main>
<script src="../data/cars.js?v=3" charset="utf-8"></script>
<script src="../shared/core.js?v=3" charset="utf-8"></script>
<script src="site.js?v=3" charset="utf-8"></script>
</body>
</html>
